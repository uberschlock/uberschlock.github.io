<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My GitHub Projects</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
    }

    #repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card-title a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .card-title a:hover {
      text-decoration: underline;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .badge {
      display: inline-block;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .live-demo-btn {
      color: #3fb950;
      text-decoration: none;
      font-weight: 600;
    }
    .live-demo-btn:hover { text-decoration: underline; }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--muted);
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="user-title">My Projects</h1>
    <p>A live list of my open-source repositories</p>
  </header>

  <div id="loading">Loading repositories...</div>
  <div id="repo-grid"></div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GITHUB USERNAME:
    const GITHUB_USERNAME = "YOUR_GITHUB_USERNAME_HERE";
    // -------------------------------------------------------------

    document.getElementById("user-title").innerText = `${GITHUB_USERNAME}'s Projects`;

    async function fetchRepos() {
      const grid = document.getElementById("repo-grid");
      const loading = document.getElementById("loading");

      try {
        // Fetch up to 100 public repos sorted by last updated
        const response = await fetch(
          `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`
        );
        
        if (!response.ok) throw new Error("User not found or API limit reached.");
        
        let repos = await response.json();

        // Optional: Filter out forks or the site's own repo
        repos = repos.filter(repo => !repo.fork && repo.name !== `${GITHUB_USERNAME}.github.io`);

        loading.style.display = "none";

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "card";

          // Check if repo has GitHub Pages enabled or a homepage link
          const liveUrl = repo.has_pages 
            ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` 
            : repo.homepage;

          card.innerHTML = `
            <div>
              <h2 class="card-title">
                <a href="${repo.html_url}" target="_blank" rel="noopener">${repo.name}</a>
              </h2>
              <p class="card-desc">${repo.description || "No description provided."}</p>
            </div>
            <div class="card-meta">
              <span>${repo.language ? `<span class="badge">${repo.language}</span>` : ""}</span>
              ${liveUrl ? `<a class="live-demo-btn" href="${liveUrl}" target="_blank" rel="noopener">Live Demo ↗</a>` : ""}
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
      }
    }

    fetchRepos();
  </script>
</body>
</html>
