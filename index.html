<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects & Web Apps</title>

  <!-- Clean Sci-Fi Monospace & Tech Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Glowing Sci-Fi Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2307090e' rx='16'/><polygon points='35,25 75,50 35,75' fill='%2300f3ff'/><path d='M10 10 L30 10 M10 10 L10 30' stroke='%2300f3ff' stroke-width='4' fill='none'/></svg>" type="image/svg+xml">

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(13, 18, 28, 0.85);
      --neon-cyan: #00f3ff;
      --neon-indigo: #6366f1;
      --neon-pink: #ff2a85;
      --border-cyan: rgba(0, 243, 255, 0.3);
      --border-hover: #00f3ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --grid-line: rgba(0, 243, 255, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text-main);
      padding: 3.5rem 1.5rem;
      max-width: 1150px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Ultra-Fine 1px Subtle Scanline Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22),
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
      opacity: 0.5;
    }

    header {
      margin-bottom: 3.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.4), 0 0 30px rgba(99, 102, 241, 0.2);
      margin-bottom: 0.6rem;
    }

    header p {
      font-family: 'Fira Code', monospace;
      color: var(--neon-cyan);
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    #repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* Sci-Fi Angled Frame Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-cyan);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      /* Sci-Fi Cut Corners Frame Geometry */
      clip-path: polygon(
        0 0, 
        calc(100% - 16px) 0, 
        100% 16px, 
        100% 100%, 
        16px 100%, 
        0 calc(100% - 16px)
      );
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.08);
    }

    /* Sci-Fi Corner Accent Markers */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 12px; height: 12px;
      border-top: 2px solid var(--neon-cyan);
      border-left: 2px solid var(--neon-cyan);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      bottom: 0; right: 0;
      width: 12px; height: 12px;
      border-bottom: 2px solid var(--neon-cyan);
      border-right: 2px solid var(--neon-cyan);
      pointer-events: none;
    }

    /* Glowing Hover State */
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 25px rgba(0, 243, 255, 0.35),
        inset 0 0 15px rgba(0, 243, 255, 0.1);
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Title Link with Subtle Glow */
    .card-title a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .card:hover .card-title a {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .card-desc {
      font-size: 0.925rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    /* Prominent Sci-Fi Action Button */
    .btn-launch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.15), rgba(99, 102, 241, 0.25));
      border: 1px solid var(--neon-cyan);
      color: #ffffff;
      padding: 0.7rem 1rem;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.5px;
      text-decoration: none;
      margin-bottom: 1.1rem;
      transition: all 0.25s ease;
      /* Clipped button frame */
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-launch:hover {
      background: var(--neon-cyan);
      color: #04060a;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.7);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ffffff;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
    }

    /* Footer Meta Info & Secondary Source Link */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-top: 1px dashed var(--border-cyan);
      padding-top: 0.85rem;
      font-family: 'Fira Code', monospace;
    }

    .badge {
      display: inline-block;
      color: var(--neon-cyan);
      background: rgba(0, 243, 255, 0.08);
      border: 1px solid rgba(0, 243, 255, 0.3);
      padding: 0.15rem 0.55rem;
      border-radius: 2px;
      font-size: 0.725rem;
    }

    /* Subtle Secondary Source Link */
    .github-source-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .github-source-link:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 6px rgba(0, 243, 255, 0.4);
    }

    #loading {
      text-align: center;
      font-family: 'Fira Code', monospace;
      font-size: 1.1rem;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="user-title">Projects</h1>
    <p>Live Web Applications & Software Repositories</p>
  </header>

  <div id="loading">Initializing Repository Directory...</div>
  <div id="repo-grid"></div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GITHUB USERNAME:
    const GITHUB_USERNAME = "uberschlock";
    // -------------------------------------------------------------

    document.getElementById("user-title").innerText = `${GITHUB_USERNAME} // Projects`;

    async function fetchRepos() {
      const grid = document.getElementById("repo-grid");
      const loading = document.getElementById("loading");

      try {
        const response = await fetch(
          `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`
        );
        
        if (!response.ok) throw new Error("Unable to load repositories.");
        
        let repos = await response.json();

        // Exclude forks and the root site repository
        repos = repos.filter(repo => !repo.fork && repo.name !== `${GITHUB_USERNAME}.github.io`);

        loading.style.display = "none";

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "card";

          // Determine Live Demo Link (GitHub Pages or Custom Homepage URL)
          const liveUrl = repo.has_pages 
            ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` 
            : repo.homepage;

          const mainTargetUrl = liveUrl || repo.html_url;
          const hasLiveDemo = Boolean(liveUrl);

          card.innerHTML = `
            <div>
              <div class="card-header">
                <h2 class="card-title">
                  <a href="${mainTargetUrl}" target="_blank" rel="noopener">${repo.name}</a>
                </h2>
              </div>
              <p class="card-desc">${repo.description || "No description provided."}</p>
            </div>

            <div>
              <!-- Prominent Action Button -->
              <a class="btn-launch ${hasLiveDemo ? '' : 'btn-secondary'}" 
                 href="${mainTargetUrl}" 
                 target="_blank" 
                 rel="noopener">
                 ${hasLiveDemo ? 'Launch Demo ↗' : 'View Project ↗'}
              </a>

              <div class="card-footer">
                <span>${repo.language ? `<span class="badge">${repo.language}</span>` : ""}</span>
                
                <!-- Secondary Source Code Link -->
                <a class="github-source-link" href="${repo.html_url}" target="_blank" rel="noopener">
                  Source Code ↗
                </a>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
        loading.style.color = "var(--neon-pink)";
      }
    }

    fetchRepos();
  </script>
</body>
</html>
