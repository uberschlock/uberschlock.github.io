<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects & Web Apps</title>

  <!-- Clean Retro Monospace & Display Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Subtle Cyberpunk Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0d12' rx='20'/><polygon points='35,25 75,50 35,75' fill='%2322d3ee'/></svg>" type="image/svg+xml">

  <style>
    :root {
      --bg-dark: #080a0f;
      --card-bg: rgba(15, 20, 30, 0.85);
      --border-color: rgba(99, 102, 241, 0.2);
      --border-hover: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-cyan-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --grid-line: rgba(99, 102, 241, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      padding: 3.5rem 1.5rem;
      max-width: 1150px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* Ultra-Fine & Subtle CRT Scanlines Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18),
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 999;
      opacity: 0.6;
    }

    header {
      margin-bottom: 3.5rem;
      text-align: center;
    }

    header h1 {
      font-family: 'Fira Code', monospace;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 0.6rem;
    }

    header p {
      font-family: 'Fira Code', monospace;
      color: var(--accent-cyan);
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    #repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease-in-out;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 8px 30px var(--accent-cyan-glow);
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: 'Fira Code', monospace;
      font-size: 1.15rem;
      font-weight: 600;
    }

    /* Primary Title Link points to Live Demo */
    .card-title a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card-title a:hover {
      color: var(--accent-cyan);
    }

    .card-desc {
      font-size: 0.925rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    /* Prominent Primary Launch Button */
    .btn-launch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(56, 189, 248, 0.2));
      border: 1px solid var(--accent-indigo);
      color: #ffffff;
      padding: 0.65rem 1rem;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 6px;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: all 0.2s ease;
    }

    .btn-launch:hover {
      background: var(--accent-indigo);
      border-color: var(--accent-indigo);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      color: #ffffff;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #ffffff;
      color: #ffffff;
      box-shadow: none;
    }

    /* Footer Meta Info & Secondary Source Link */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 0.85rem;
      font-family: 'Fira Code', monospace;
    }

    .badge {
      display: inline-block;
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.725rem;
    }

    /* Secondary Link to GitHub Source Code */
    .github-source-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .github-source-link:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    #loading {
      text-align: center;
      font-family: 'Fira Code', monospace;
      font-size: 1.1rem;
      color: var(--accent-cyan);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="user-title">Projects</h1>
    <p>Live Web Applications & Software Repositories</p>
  </header>

  <div id="loading">Loading repositories...</div>
  <div id="repo-grid"></div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GITHUB USERNAME:
    const GITHUB_USERNAME = "uberschlock";
    // -------------------------------------------------------------

    document.getElementById("user-title").innerText = `${GITHUB_USERNAME} // Projects`;

    async function fetchRepos() {
      const grid = document.getElementById("repo-grid");
      const loading = document.getElementById("loading");

      try {
        const response = await fetch(
          `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`
        );
        
        if (!response.ok) throw new Error("Unable to load repositories.");
        
        let repos = await response.json();

        // Filter out forks and the root site repository
        repos = repos.filter(repo => !repo.fork && repo.name !== `${GITHUB_USERNAME}.github.io`);

        loading.style.display = "none";

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "card";

          // Determine Live Demo Link (GitHub Pages or Custom Homepage URL)
          const liveUrl = repo.has_pages 
            ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` 
            : repo.homepage;

          const mainTargetUrl = liveUrl || repo.html_url;
          const hasLiveDemo = Boolean(liveUrl);

          card.innerHTML = `
            <div>
              <div class="card-header">
                <h2 class="card-title">
                  <a href="${mainTargetUrl}" target="_blank" rel="noopener">${repo.name}</a>
                </h2>
              </div>
              <p class="card-desc">${repo.description || "No description provided."}</p>
            </div>

            <div>
              <!-- Prominent Launch Button -->
              <a class="btn-launch ${hasLiveDemo ? '' : 'btn-secondary'}" 
                 href="${mainTargetUrl}" 
                 target="_blank" 
                 rel="noopener">
                 ${hasLiveDemo ? 'Launch Demo ↗' : 'View Project ↗'}
              </a>

              <div class="card-footer">
                <span>${repo.language ? `<span class="badge">${repo.language}</span>` : ""}</span>
                
                <!-- Subtle Secondary Source Code Link -->
                <a class="github-source-link" href="${repo.html_url}" target="_blank" rel="noopener">
                  Source Code ↗
                </a>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
        loading.style.color = "#ef4444";
      }
    }

    fetchRepos();
  </script>
</body>
</html>
