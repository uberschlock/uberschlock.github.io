<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CYBERDECK // PROGRAM DIRECTORY</title>

  <!-- Glowing Neon '▶' Cyber Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0017' rx='20'/><polygon points='30,20 80,50 30,80' fill='%2300f3ff'/></svg>" type="image/svg+xml">
  
  <!-- Retro Cyberpunk Fonts from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0017;
      --card-bg: rgba(20, 5, 38, 0.85);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-purple: #b026ff;
      --neon-yellow: #ffe600;
      --text-main: #e2f1ff;
      --text-muted: #8e9bb0;
      --grid-line: rgba(255, 0, 127, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: var(--bg-dark);
      /* 80s Cyber Neon Grid Pattern */
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text-main);
      padding: 3rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* CRT Scanline Overlay Effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 999;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    header {
      margin-bottom: 3.5rem;
      text-align: center;
      position: relative;
    }

    /* Synthwave Glowing Title */
    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-pink),
        0 0 40px var(--neon-pink),
        0 0 80px var(--neon-pink);
      margin-bottom: 0.75rem;
    }

    header p {
      color: var(--neon-cyan);
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    #repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* Cyber Card Container */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--neon-pink);
      border-radius: 4px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.2), inset 0 0 15px rgba(255, 0, 127, 0.1);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5), inset 0 0 20px rgba(0, 243, 255, 0.2);
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Main Title Link points directly to Live Demo */
    .card-title a {
      color: #fff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .card:hover .card-title a {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    /* Prominent Retro CTA Button for Live Demo */
    .btn-launch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      text-align: center;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
      color: #fff;
      padding: 0.75rem 1rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 1.2rem;
      border: none;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
      transition: all 0.2s ease;
    }

    .btn-launch:hover {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
      color: #000;
      font-weight: 900;
    }

    .btn-secondary {
      background: #190a2e;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #2b124c;
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Footer Meta Info & Secondary Source Link */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-top: 1px dashed rgba(255, 0, 127, 0.3);
      padding-top: 0.85rem;
    }

    .badge {
      display: inline-block;
      color: var(--neon-yellow);
      background: rgba(255, 230, 0, 0.1);
      border: 1px solid rgba(255, 230, 0, 0.3);
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Subtle Secondary Link to GitHub Source Code */
    .github-source-link {
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .github-source-link:hover {
      color: var(--neon-cyan);
      text-shadow: 0 0 5px var(--neon-cyan);
    }

    #loading {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      color: var(--neon-cyan);
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-top: 5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="user-title">CYBER DECK</h1>
    <p>// SYSTEM STATUS: ONLINE // SELECT PROGRAM TO RUN</p>
  </header>

  <div id="loading">[ INITIALIZING SYSTEM DIRECTORY... ]</div>
  <div id="repo-grid"></div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GITHUB USERNAME:
    const GITHUB_USERNAME = "uberschlock";
    // -------------------------------------------------------------

    document.getElementById("user-title").innerText = `${GITHUB_USERNAME}.EXE`;

    async function fetchRepos() {
      const grid = document.getElementById("repo-grid");
      const loading = document.getElementById("loading");

      try {
        const response = await fetch(
          `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`
        );
        
        if (!response.ok) throw new Error("ACCESS_DENIED // USER NOT FOUND");
        
        let repos = await response.json();

        // Exclude forks and the root site repository
        repos = repos.filter(repo => !repo.fork && repo.name !== `${GITHUB_USERNAME}.github.io`);

        loading.style.display = "none";

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "card";

          // Determine Live Demo Link (GitHub Pages or Custom Homepage URL)
          const liveUrl = repo.has_pages 
            ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` 
            : repo.homepage;

          const mainTargetUrl = liveUrl || repo.html_url;
          const hasLiveDemo = Boolean(liveUrl);

          card.innerHTML = `
            <div>
              <div class="card-header">
                <h2 class="card-title">
                  <a href="${mainTargetUrl}" target="_blank" rel="noopener">${repo.name}</a>
                </h2>
              </div>
              <p class="card-desc">${repo.description || "NO DATA DESCRIPTION AVAILABLE."}</p>
            </div>

            <div>
              <!-- Prominent Retro Action Button -->
              <a class="btn-launch ${hasLiveDemo ? '' : 'btn-secondary'}" 
                 href="${mainTargetUrl}" 
                 target="_blank" 
                 rel="noopener">
                 ▶ ${hasLiveDemo ? 'EXECUTE PROGRAM' : 'VIEW MATRIX'}
              </a>

              <div class="card-footer">
                <span>${repo.language ? `<span class="badge">[ ${repo.language} ]</span>` : ""}</span>
                
                <!-- Subtle Secondary Source Code Link -->
                <a class="github-source-link" href="${repo.html_url}" target="_blank" rel="noopener">
                  // SOURCE
                </a>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerText = `[ ERROR: ${err.message} ]`;
        loading.style.color = "var(--neon-pink)";
      }
    }

    fetchRepos();
  </script>
</body>
</html>
