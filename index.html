<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Live Web Apps & Projects</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #238636; /* Bright Green for Live Demo CTA */
      --accent-hover: #2ea043;
      --muted: #8b949e;
      --link: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2.5rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    #repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #484f58;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    /* Prominent Title Link points to Live Demo */
    .card-title a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }

    .card-title a:hover {
      color: var(--link);
      text-decoration: underline;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    /* Big Prominent Live Demo CTA Button */
    .btn-launch {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--accent);
      color: #ffffff;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      margin-bottom: 1rem;
      transition: background-color 0.2s;
    }

    .btn-launch:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }

    /* Footer Meta Info & Small GitHub Link */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 0.85rem;
    }

    .badge {
      display: inline-block;
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.75rem;
    }

    /* Subtle Small GitHub Source Link */
    .github-source-link {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }

    .github-source-link:hover {
      color: var(--link);
      text-decoration: underline;
    }

    #loading {
      text-align: center;
      font-size: 1.2rem;
      color: var(--muted);
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="user-title">My Projects</h1>
    <p>Explore my live web applications and software</p>
  </header>

  <div id="loading">Loading projects...</div>
  <div id="repo-grid"></div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS WITH YOUR GITHUB USERNAME:
    const GITHUB_USERNAME = "uberschlock";
    // -------------------------------------------------------------

    document.getElementById("user-title").innerText = `${GITHUB_USERNAME}'s Apps`;

    async function fetchRepos() {
      const grid = document.getElementById("repo-grid");
      const loading = document.getElementById("loading");

      try {
        const response = await fetch(
          `https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`
        );
        
        if (!response.ok) throw new Error("User not found or API limit reached.");
        
        let repos = await response.json();

        // Hide forks and the root user site repo itself
        repos = repos.filter(repo => !repo.fork && repo.name !== `${GITHUB_USERNAME}.github.io`);

        loading.style.display = "none";

        repos.forEach(repo => {
          const card = document.createElement("div");
          card.className = "card";

          // Determine the Live Demo URL (GitHub Pages or Custom Homepage URL)
          const liveUrl = repo.has_pages 
            ? `https://${GITHUB_USERNAME}.github.io/${repo.name}` 
            : repo.homepage;

          // Primary link points to Live Demo if present, otherwise fallback to repo
          const mainTargetUrl = liveUrl || repo.html_url;
          const hasLiveDemo = Boolean(liveUrl);

          card.innerHTML = `
            <div>
              <div class="card-header">
                <h2 class="card-title">
                  <a href="${mainTargetUrl}" target="_blank" rel="noopener">${repo.name}</a>
                </h2>
              </div>
              <p class="card-desc">${repo.description || "No description provided."}</p>
            </div>

            <div>
              <!-- Prominent Action Button -->
              <a class="btn-launch ${hasLiveDemo ? '' : 'btn-secondary'}" 
                 href="${mainTargetUrl}" 
                 target="_blank" 
                 rel="noopener">
                 ${hasLiveDemo ? 'Launch App 🚀' : 'View Project'}
              </a>

              <div class="card-footer">
                <span>${repo.language ? `<span class="badge">${repo.language}</span>` : ""}</span>
                
                <!-- Subtle Secondary Link to GitHub Source Code -->
                <a class="github-source-link" href="${repo.html_url}" target="_blank" rel="noopener">
                  Source Code ↗
                </a>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
      }
    }

    fetchRepos();
  </script>
</body>
</html>
